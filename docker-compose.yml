version: "3"
services:
  db:
    image: postgres:17
    container_name: local-postgres-fast-campus
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: gocatalogmusic_db

    volumes:
      - /FastCampusDb/postgres_db/db:/var/lib/postgresql/data
